name: Browser extension

on:
  push:
    branches: [main]
    paths: ['browser-extension/**', '.github/workflows/browser-extension.yml']
  pull_request:
    paths: ['browser-extension/**', '.github/workflows/browser-extension.yml']

defaults:
  run:
    working-directory: browser-extension

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, msedge]
    name: build (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm run package
      - if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps --no-shell chromium
      - if: matrix.browser == 'msedge'
        run: npx playwright install --with-deps msedge
      - run: npm run e2e
        env:
          BROWSER: ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: browser-extension/*.zip
