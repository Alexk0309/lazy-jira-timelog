<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timelog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <nav class="tabbar" id="tabs" aria-label="Views"></nav>
    <header class="top">
      <div>
        <p class="eyebrow" id="date"></p>
        <h1 class="hero" id="total">&nbsp;</h1>
        <div class="status" id="status"><span class="dot"></span><span id="status-text">Not tracking</span></div>
      </div>
      <div class="icon-buttons">
        <button class="icon-button" id="prev-day" title="Previous day" aria-label="Previous day">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button class="btn btn-plain" id="to-today" hidden>Today</button>
        <button class="icon-button" id="next-day" title="Next day" aria-label="Next day">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <span class="date-pick">
          <button class="icon-button" id="pick-button" title="Pick a date" aria-label="Pick a date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </button>
          <input type="date" id="pick-day" tabindex="-1" aria-hidden="true">
        </span>
      </div>
    </header>

    <div class="week" id="week" role="group" aria-label="Days of the week"></div>
    <p class="footnote other-days" id="other-days" hidden></p>

    <div id="setup" class="card" hidden>
      <h2>Connect Jira</h2>
      <p id="setup-text"></p>
      <div><button class="btn btn-primary" id="setup-button">Open Settings</button></div>
    </div>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>
      <h2>You're all caught up</h2>
      <p>Time spent on Jira issues, pull requests and linked pages shows up here.</p>
    </div>

    <main id="days"></main>
  </div>

  <div class="bottom-bar" id="bottom" hidden>
    <button class="btn btn-primary" id="log-all">Log all</button>
    <p class="bottom-hint" id="bottom-hint" hidden></p>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="review.js"></script>
</body>
</html>
